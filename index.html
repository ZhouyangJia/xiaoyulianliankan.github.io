<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生日快乐连连看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .header {
            text-align: center;
            padding: 15px 0;
            background-color: rgba(255, 255, 255, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            color: #e91e63;
            font-size: 1.5em;
            margin: 0;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            max-width: 100%;
            margin: 0 auto;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 450px;
            margin: 10px auto;
            background-color: rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 12px;
        }

        .card {
            width: 80%;
            height: 120%;
            aspect-ratio: 3 / 4;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        
        .card.selected {
            transform: scale(0.85);
            box-shadow: 0 0 15px #ffeb3b, inset 0 0 15px rgba(255, 235, 59, 0.5);
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            background-color: rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 10px;
        }

        .card.flipped {
            opacity: 0.8;
            transform: scale(0.95);
        }

        .card.selected {
            transform: scale(0.9);
            box-shadow: 0 0 15px #ffeb3b, inset 0 0 15px rgba(255, 235, 59, 0.5);
        }

        .card.matched {
            opacity: 0.5;
            visibility: hidden;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            width: 100%;
            max-width: 350px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: linear-gradient(to right, #e91e63, #9c27b0);
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s;
            flex: 1;
            max-width: 150px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        .moves-counter {
            text-align: center;
            font-size: 18px;
            color: #880e4f;
            margin: 10px 0;
            font-weight: bold;
        }

        .win-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .win-content {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            padding: 10px;
            padding: 30px;
            border-radius: 20px;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .baby-image {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            display: block;
        }

        .reward-text {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 20px 0;
        }

        .restart-btn {
            margin-top: 20px;
            background: linear-gradient(to right, #4caf50, #2e7d32);
            padding: 15px 30px;
            font-size: 18px;
        }

        @media (max-width: 400px) {
            .game-board {
                grid-template-columns: repeat(6, 1fr);
                max-width: 280px;
            }
            
        .card {
            width: 75%;
            height: 100%;
            aspect-ratio: 3 / 4;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎂 生日快乐连连看 🎂</h1>
    </div>
    
    <div class="game-container">
        <div class="moves-counter">步数: <span id="moves">0</span></div>
        <div class="timer">时间: <span id="timer">00:00</span></div>
        
        <div class="game-board" id="game-board"></div>
        
        <div class="controls">
            <button id="reset-btn">重新开始</button>
            <button id="hint-btn">提示</button>
        </div>
    </div>
    
    <div class="win-message" id="win-message">
        <div class="win-content">
                <img src="assets/img.png" class="baby-image" />
            <div class="reward-text">奖励家庭基金200000元</div>
            <p>🎉 恭喜通关！🎉</p>
            <p>祝亲爱的生日快乐！</p>
            <button class="restart-btn" id="win-restart-btn">再玩一次</button>
        </div>
    </div>

                "assets/resized/resized_IMG_1461484403_20260213_210650223.jpg.jpg",
                "assets/resized/resized_IMG_1461491194_20260213_210656742.jpg.jpg"
            ];

            // 从可用图片中随机选择指定数量的图片对
            function getRandomImages(count) {
                // 从所有可用图片中随机选择指定数量的不同图片
                // 确保不会重复使用同一张图片超过所需数量
                const shuffled = [...imagePaths].sort(() => 0.5 - Math.random());
                
                // 如果需要的图片对数量超过了可用图片数量，复制数组以满足需求
                if(count > shuffled.length) {
                    const extendedImages = [];
                    for(let i = 0; i < count; i++) {
                        extendedImages.push(shuffled[i % shuffled.length]);
                    }
                    // 再次打乱以避免明显的重复模式
                    return extendedImages.sort(() => 0.5 - Math.random());
                } else {
                    return shuffled.slice(0, count);
                }
            }

            // 创建卡片数据
            function createCards() {
                const selectedImages = getRandomImages(config.totalPairs);
                let cards = [];
                
                // 每个图片创建两个卡片（一对）
                for (let i = 0; i < selectedImages.length; i++) {
                    cards.push({ id: i, image: selectedImages[i], matched: false });
                    cards.push({ id: i, image: selectedImages[i], matched: false });
                }
                
                // 打乱卡片顺序
                return cards.sort(() => 0.5 - Math.random());
            }

            // 游戏状态
            const gameState = {
                cards: [],
                flippedCards: [],
                matchedPairs: 0,
                moves: 0,
                canFlip: true,
                levelComplete: false,
                timerStarted: false
            };

            // DOM 元素
            const gameBoard = document.getElementById('game-board');
            const movesDisplay = document.getElementById('moves');
            const resetBtn = document.getElementById('reset-btn');
            const hintBtn = document.getElementById('hint-btn');
            const winMessage = document.getElementById('win-message');
            const winRestartBtn = document.getElementById('win-restart-btn');

            // 初始化游戏
            function initGame() {
                const levelConfig = levels[currentLevel];
                
                // 更新游戏配置
                config.rows = levelConfig.rows;
                config.cols = levelConfig.cols;
                config.totalPairs = levelConfig.totalPairs;
                
                gameState.cards = createCards();
                gameState.flippedCards = [];
                gameState.matchedPairs = 0;
                gameState.moves = 0;
                gameState.canFlip = true;
                gameState.levelComplete = false;
                
                movesDisplay.textContent = gameState.moves;
                gameBoard.innerHTML = '';
                
                // 设置游戏板网格
                gameBoard.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;
                gameBoard.style.gridTemplateRows = `repeat(${config.rows}, 1fr)`;
                
                // 创建卡片元素
                gameState.cards.forEach((card, index) => {
                    const cardElement = document.createElement('div');
                    cardElement.className = 'card';
                    cardElement.dataset.index = index;
                    
                    // 使用背景图片方式显示图片
                    cardElement.style.backgroundImage = `url('${card.image}')`;
                    
                    cardElement.addEventListener('click', () => flipCard(cardElement, index));
                    gameBoard.appendChild(cardElement);
                });
            }

            // 翻转卡片
            function flipCard(cardElement, index) {
                if (!gameState.canFlip) return;
                if (cardElement.classList.contains('flipped')) return;
                if (gameState.flippedCards.length >= 2) return;
                
                // 首次点击启动计时器
                if (!gameState.timerStarted) {
                    startTimer();
                    gameState.timerStarted = true;
                }
                
                cardElement.classList.add('flipped');
                cardElement.classList.add('selected');
                
                gameState.flippedCards.push({ element: cardElement, index: index });
                
                if (gameState.flippedCards.length === 2) {
                    gameState.moves++;
                    movesDisplay.textContent = gameState.moves;
                    
                    gameState.canFlip = false;
                    
                    const card1 = gameState.flippedCards[0];
                    const card2 = gameState.flippedCards[1];
                    
                    if (gameState.cards[card1.index].id === gameState.cards[card2.index].id) {
                        // 匹配成功
                        setTimeout(() => {
                            // 放大动画
                            card1.element.style.transform = 'scale(1.5)';
                            card2.element.style.transform = 'scale(1.5)';
                            
                            // 1秒后消失
                            setTimeout(() => {
                                card1.element.style.visibility = 'hidden';
                                card2.element.style.visibility = 'hidden';
                                
                                gameState.matchedPairs++;
                                gameState.flippedCards = [];
                                gameState.canFlip = true;
                                
                                // 检查是否完成游戏
                                if (gameState.matchedPairs === config.totalPairs) {
                                    setTimeout(showWinMessage, 500);
                                }
                            }, 1000);
                        }, 500);
                    } else {
                        // 不匹配，翻回去
                        setTimeout(() => {
                            card1.element.classList.remove('flipped', 'selected');
                            card2.element.classList.remove('flipped', 'selected');
                            
                            gameState.flippedCards = [];
                            gameState.canFlip = true;
                        }, 1000);
                    }
                }
            }

            // 显示胜利消息
            function showWinMessage() {
                clearInterval(timerInterval);
                if(currentLevel < levels.length - 1) {
                    // 还有下一关
                    setTimeout(() => {
                        currentLevel++;
                        alert(`恭喜完成${levels[currentLevel-1].levelName}！进入${levels[currentLevel].levelName}`);
                        resetTimer();
                        initGame();
                        startTimer();
                    }, 600);
                } else {
                    // 所有关卡完成
                    winMessage.style.display = 'flex';
                }
            }

            // 重置游戏
            function resetGame() {
                winMessage.style.display = 'none';
                resetTimer();
                initGame();
            }

            // 提示功能
            function showHint() {
                if (!gameState.canFlip || gameState.flippedCards.length >= 2) return;
                
                // 寻找可匹配的卡片对
                const unflippedCards = [];
                for (let i = 0; i < gameState.cards.length; i++) {
                    const cardElement = document.querySelector(`.card[data-index="${i}"]`);
                    if (!cardElement.classList.contains('flipped') && !cardElement.classList.contains('matched')) {
                        unflippedCards.push({ index: i, card: gameState.cards[i], element: cardElement });
                    }
                }
                
                // 查找是否有相同的卡片
                for (let i = 0; i < unflippedCards.length; i++) {
                    for (let j = i + 1; j < unflippedCards.length; j++) {
                        if (unflippedCards[i].card.id === unflippedCards[j].card.id) {
                            // 高亮这两个卡片一会儿
                            unflippedCards[i].element.style.boxShadow = '0 0 20px #ffeb3b, inset 0 0 20px rgba(255, 235, 59, 0.5)';
                            unflippedCards[j].element.style.boxShadow = '0 0 20px #ffeb3b, inset 0 0 20px rgba(255, 235, 59, 0.5)';
                            
                            setTimeout(() => {
                                if (!unflippedCards[i].element.classList.contains('flipped')) {
                                    unflippedCards[i].element.style.boxShadow = '';
                                }
                                if (!unflippedCards[j].element.classList.contains('flipped')) {
                                    unflippedCards[j].element.style.boxShadow = '';
                                }
                            }, 1000);
                            
                            return;
                        }
                    }
                }
            }
            
            // 计时器相关变量
            let timer = 0;
            let timerInterval = null;
            
            // 格式化时间显示
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                return `${mins}:${secs}`;
            }
            
            // 开始计时
            function startTimer() {
                timer = 0;
                document.getElementById('timer').textContent = formatTime(timer);
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timer++;
                    document.getElementById('timer').textContent = formatTime(timer);
                }, 1000);
            }
            
            // 重置计时器
            function resetTimer() {
                clearInterval(timerInterval);
                timer = 0;
                document.getElementById('timer').textContent = formatTime(timer);
            }

            // 事件监听器
            resetBtn.addEventListener('click', resetGame);
            hintBtn.addEventListener('click', showHint);
            winRestartBtn.addEventListener('click', resetGame);

            // 初始化游戏
            initGame();
        });
        
        // 开始计时（在首次点击时启动）
        function startTimer() {
            if (timerInterval) return; // 避免重复启动
            
            timer = 0;
            document.getElementById('timer').textContent = formatTime(timer);
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').textContent = formatTime(timer);
            }, 1000);
        }
    </script>
</body>
</html>
